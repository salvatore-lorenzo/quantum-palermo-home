title: "Beyond Linearity: Frontiers in Non-Hermitian Many-Body Physics"
short: BLINH2025
kind: conference
start: 2025-12-14
end: 2025-12-18
venue: Ettore Majorana Foundation and Centre for Scientific Culture
city: Erice, Italy
series: International School on Nonequilibrium Phenomena
series_directors: A. Lanzara, G. M. Palma, B. Spagnolo
directors:
  - F. Balducci
  - P. Brighi
  - F. Ciccarello
  - A. Nunnenkamp
  - F. Roccati
website: https://blinh2025.univie.ac.at/index.html
description: >-
  The workshop aims at bringing together experts in the fields of non-Hermitian and
  quantum many-body physics to discuss recent advancements and future prospects at their
  intersection. The central goal of the workshop will be to delve into non-Hermitian
  physics beyond the linear regime.

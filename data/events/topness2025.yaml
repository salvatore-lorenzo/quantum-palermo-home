title: Non-Equilibrium Phenomena, Topology, Superconductivity, and Superfluidity
short: TOPNESS2025
kind: conference
start: 2025-04-27
end: 2025-05-01
venue: Ettore Majorana Foundation and Centre for Scientific Culture
city: Erice, Italy
series: International School on Nonequilibrium Phenomena
series_directors: A. Lanzara, G. M. Palma, B. Spagnolo
directors:
  - R. Citro
  - C. Guarcello
  - D. Valenti
website: https://conferences.phys.unisa.it/topness25/
description: >-
  This conference brings together leading experts from around the world to explore
  cutting-edge topics in condensed matter physics, including non-equilibrium phenomena,
  topological materials, superconductivity, and superfluidity. Special attention will be
  given to dynamic phase transitions, exotic superconducting states, and the interplay of
  topology and correlations in novel materials. The event provides a unique platform for
  fostering collaboration between theorists and experimentalists, sharing the latest
  advances, and inspiring innovative applications. Sessions will include invited talks,
  poster presentations, and focused discussions to engage participants and promote new
  ideas.

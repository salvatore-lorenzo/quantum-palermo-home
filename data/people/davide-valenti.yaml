bio: >-
  Davide Valenti is professor of Theoretical Physics at University of Palermo, Italy. His
  research fields range from nonequilibrium statistical mechanics in quantum physics,
  stochastic processes in nonlinear systems, to effects of noise in population dynamics
  and financial markets. He is currently editor of two scientific journals in the field of
  physics and mathematics. He’s co-author of more than 130 articles indexed in Web of
  Science and teaches the course of Physics of Complex Systems in the Master Degree in
  Physics.

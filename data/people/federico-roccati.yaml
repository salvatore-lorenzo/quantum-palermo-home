bio: >-
  Federico is an Assistant Professor (RTDa) of Physics (PHYS-04/A) since March 2025.
  Previously, he was a Postdoctoral Researcher at the Max Planck Institute for the Science
  of Light (September 2024–February 2025) in the 'Non-Hermitian Topological Phenomena'
  group led by Prof. Flore Kunst. From March to August 2024, he was a Fulbright Research
  Scholar at Columbia University, working in the Quantum Optics group led by Prof. Ana
  Asenjo-Garcia. Between March 2022 and February 2024, he was a Postdoctoral Researcher at
  the University of Luxembourg in the group of Prof. Aurelia Chenu. Federico earned his
  Ph.D. in Physics from the University of Palermo in March 2022 under the supervision of
  Prof. Francesco Ciccarello. He holds a Master's degree in Theoretical and Mathematical
  Physics from Ludwig Maximilian University & Technical University of Munich (2018) and
  previously completed a Master’s and Bachelor’s degree in Mathematics at the University
  of Torino and Palermo, respectively. In 2023, he received the Fulbright Scholarship,
  awarded by the U.S.-Italy Fulbright Commission. In 2024, his Marie Curie proposal
  received the Seal of Excellence, and in 2025, it was accepted for funding. He is also a
  member of the Editorial Board of the Journal of Physics Communications.

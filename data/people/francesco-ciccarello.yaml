bio: >-
  Francesco Ciccarello is an Associate Professor of Physics of Matter (FIS/03) and holds
  the Italian National Scientific Habilitation as Full Professor in Theoretical Physics of
  Matter (02B2) and Theoretical Physics of fundamental interactions (02A2). In 2016, he
  was awarded a prestigious Fulbright research scholarship which was spent at Duke
  University, USA. He was a postdoctoral research associate at Scuola Normale Superiore,
  Pisa (2011-2012) and a visiting research fellow at Queen’s University Belfast, UK (2008)
  and Stanford University, USA (2019). He is a member of the Editorial Board of
  [Quantum](https://quantum-journal.org/), [Journal of the Optical Society of America
  B](https://opg.optica.org/josab/journal/josab/about.cfm#board),
  [Entropy](https://www.mdpi.com/journal/entropy/editors), [Plos
  One](https://journals.plos.org/plosone/static/editorial-board), [Journal of Physics
  Communications](https://iopscience.iop.org/journal/2399-6528). He authored about 70
  papers published in various journals, including Physical Review Letters, Optica, Physics
  Reports, Nanophotonics, Quantum Science and Technology and Nature Communications. He is
  expert in open quantum systems, quantum optics and condensed matter. His current
  research is mostly focused on [waveguide
  QED](https://www.optica-opn.org/home/articles/volume_35/january_2024/features/waveguide_quantum_electrodynamics/),
  an emerging area across quantum optics and condensed matter, where he is the main
  organizer of a series of dedicated [workshops](https://wqed23.weebly.com/) and which
  studies quantum emitters coupled to engineered photonic structures (e.g. waveguides or
  lattices with topological or non-Hermitan properties).

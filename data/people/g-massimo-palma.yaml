bio: >-
  Massimo (full first name Gioacchino Massimo) is Full Professor in theoretical condensed
  matter and quantum optics theory and head of the Physics and Chemistry department
  “Emilio Segre” at University of Palermo. He was awarded his PhD in quantum optics 1991
  by the University of Palermo under a joint tutorship with the Blackett Laboratory,
  Imperial College London. Visiting Fellow at Max Planck Institute for Quantum Optics
  (Garching) and Human Capital Mobility Fellow at the Clarendon Laboratory Oxford he
  became Lecturer in 1996 (Unipa) and associate Professor at the University of Milan in
  2002. Back in Palermo since 2005 he became Full Professor in 2016. Founding chairman of
  the PhD course in Physical and Chemical Sciences (2013 – 2021). Member of the editorial
  board of New Journal of Physics (IOP), the International Journal of Quantum Information
  (WS), Entropy and Quantum Reports (MDPI). Codirector of the school of “non equilibrium
  phenomena” of the Ettore Majorana Foundation (Erice). One of the pioneers – since 1992 -
  of Quantum Information Theory, he is the founding president of the SISTEQ, the Italian
  society for quantum science and technology.

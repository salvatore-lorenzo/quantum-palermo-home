bio: >-
  Marco Vetrano was born in Palermo, Italy, in 1998. Marco was always interested in
  sciences in general and decided to study Physics at the University of Palermo. At first
  he was very interested in astrophysics but decided to move to the field of quantum
  computing and machine learning because he love programming. Now Marco is a PhD student
  at the University of Palermo, supervised by Prof. Palma and Prof. Lorenzo and
  cooperating also with others.

title: >-
  Quantum correlation of electron and ion energy in the dissociative strong-field
  ionization of H2
authors:
  - A. Geyer
  - O. Neufeld
  - D. Trabert
  - U. De Giovannini
  - M. Hofmann
  - N. Anders
  - L. Sarkadi
  - M. S. Schöffler
  - L. Ph. H. Schmidt
  - A. Rubio
  - T. Jahnke
  - M. Kunitski
  - S. Eckart
date: 2023-01-01
type: article
journal: Physical Review Research
volume: "5"
issue: "1"
pages: "013123"
doi: 10.1103/physrevresearch.5.013123
abstract: >-
  We report on the strong field ionization of H2 by a corotating two-color laser field. We
  measure the electron momentum distribution in coincidence with the kinetic energy
  release (KER) of dissociating hydrogen molecules. In addition to a characteristic
  half-moon structure, we observe a low-energy structure in the electron momentum
  distribution at a KER of about 3.5 eV. We speculate that the outgoing electron interacts
  with the molecular ion, despite the absence of classical recollisions under these
  conditions. Time-dependent density functional theory simulations support our
  conclusions.

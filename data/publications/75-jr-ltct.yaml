title: Emergence of quantum Darwinism and pointer states for noncommuting evolutions
authors:
  - Diana A. Chisholm
  - G. Massimo Palma
  - Luca Innocenti
date: 2026-05-01
type: article
journal: APS Open Sci.
volume: "1"

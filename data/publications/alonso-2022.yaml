abstract: >-
  We summarise the discussions at a virtual Community Workshop on Cold Atoms in Space
  concerning the status of cold atom technologies, the prospective scientific and societal
  opportunities offered by their deployment in space, and the developments needed before
  cold atoms could be operated in space. The cold atom technologies discussed include
  atomic clocks, quantum gravimeters and accelerometers, and atom interferometers.
  Prospective applications include metrology, geodesy and measurement of terrestrial mass
  change due to, e.g., climate change, and fundamental science experiments such as tests
  of the equivalence principle, searches for dark matter, measurements of gravitational
  waves and tests of quantum mechanics. We review the current status of cold atom
  technologies and outline the requirements for their space qualification, including the
  development paths and the corresponding technical milestones, and identifying possible
  pathfinder missions to pave the way for missions to exploit the full potential of cold
  atoms in space. Finally, we present a first draft of a possible road-map for achieving
  these goals, that we propose for discussion by the interested cold atom, Earth
  Observation, fundamental physics and other prospective scientific user communities,
  together with the European Space Agency (ESA) and national space and research funding
  agencies.

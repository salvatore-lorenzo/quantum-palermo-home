title: Floquet engineering of magnetism in topological insulator thin films
authors:
  - Xiaoyu Liu
  - Benshu Fan
  - Hannes Hübener
  - Umberto De Giovannini
  - Wenhui Duan
  - Angel Rubio
  - Peizhe Tang
date: 2023-01-01
type: article
journal: Electronic Structure
volume: "5"
issue: "2"
pages: "024002"
doi: 10.1088/2516-1075/acca58
research:
  - mater
abstract: >-
  Dynamic manipulation of magnetism in topological materials is demonstrated here via a
  Floquet engineering approach using circularly polarized light. Increasing the strength
  of the laser field, besides the expected topological phase transition (PT), the
  magnetically doped topological insulator thin film also undergoes a magnetic PT from
  ferromagnetism to paramagnetism, whose critical behavior strongly depends on the quantum
  quenching. In sharp contrast to the equilibrium case, the non-equilibrium Curie
  temperatures vary for different time scale and experimental setup, not all relying on
  change of topology. Our discoveries deepen the understanding of the relationship between
  topology and magnetism in the non-equilibrium regime and extend optoelectronic device
  applications to topological materials.

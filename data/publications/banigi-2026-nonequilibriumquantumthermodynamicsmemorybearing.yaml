title: Non-equilibrium quantum thermodynamics of a memory-bearing open-system process
authors:
  - Biagio G. Banigi
  - Eric Lutz
  - Mauro Paternostro
date: 2026-06-01
type: preprint
arxiv: "2606.05904"
url: https://arxiv.org/abs/2606.05904
research:
  - thermo
abstract: >-
  We show the emergence of memory effects in the dynamics of a driven two-level system
  interacting with a composite environment, and analyze their influence on work, heat and
  entropy production. We further investigate how the interplay between driving,
  dissipation and memory effects, stemming from the finiteness of the environment, shapes
  the thermodynamic response of the system, thus providing insight into quantum
  thermodynamics beyond the Markovian approximation.

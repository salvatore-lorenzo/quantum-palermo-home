title: >-
  Analysis of Ecological Shifts in the Two-Age Structured Population Model with Allee
  Effect and Environmental Noise
authors:
  - Irina Bashkirtseva
  - Davide Valenti
  - Bernardo Spagnolo
date: 2021-01-01
type: article
journal: Mathematical Methods in the Applied Sciences
volume: "44"
issue: "16"
pages: 12108--12119
doi: 10.1002/mma.6778

title: A Toolkit for Ortho-Symplectic Dualities
authors:
  - Sergio Benvenuti
  - Gabriele Lo Monaco
date: 2023-01-01
type: article
journal: JHEP
volume: "09"
pages: "002"
doi: 10.1007/JHEP09(2023)002
arxiv: "2112.12154"
abstract: >-
  We propose new confining dualities in 3d $$ N $$= 2 gauge theories with orthogonal gauge
  groups, with and without monopole superpotentials. Deriving some of those dualities
  requires a sequence of gauging and Higgsing for a $ℤ$2 symmetry. This prevents the gauge
  theory from developing a smooth quantum moduli space and affects the global structure of
  the gauge group, muting it from SO to O+.

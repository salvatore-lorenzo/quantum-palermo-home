title: >-
  Atom-Photon Bound States in Fractal Photonic Lattices: Localization Length and Anomalous
  Diffusion
authors:
  - Florian Bönsel
  - Flore K. Kunst
  - Federico Roccati
date: 2026-05-01
type: preprint
arxiv: "2605.23625"
url: https://arxiv.org/abs/2605.23625
research:
  - wqed
abstract: >-
  We study atom-photon bound states seeded by two-level emitters coupled to self-similar
  photonic lattices. By expressing the photonic Green's function through the heat kernel,
  we show that the far-field localization length obeys $ξ ∼ Δ^-1/d_w$, with the detuning
  $Δ$ from the lower spectral edge and the walk dimension $d_w$ of the underlying fractal.
  This scaling is controlled by anomalous diffusion and does not rely on translational
  invariance or a band-edge effective-mass approximation. Exact diagonalization on
  Sierpiŉski gaskets, pyramids, Vicsek graphs, and Sierpiŉski carpets confirms the
  far-field prediction once the bath Hamiltonian is rendered Laplacian-like by
  compensating the local inhomogeneity in the connectivities with on-site potentials. In
  the near field, the bound-state amplitude exhibits an additional algebraic variation.
  For nested finitely ramified fractals, the corresponding exponent agrees with the
  classical resistance/ first-passage scaling, whereas Sierpiŉski carpets display clear
  deviations from this simple law. Our results extend structured-bath waveguide QED to
  self-similar non-periodic geometries and connect bound-state profiles to transport
  exponents of the underlying fractal lattice.

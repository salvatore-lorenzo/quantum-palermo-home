title: Charging Batteries with Quantum Squeezing
authors:
  - Federico Centrone
  - Luca Mancino
  - Mauro Paternostro
date: 2023-11-01
type: article
journal: Physical Review A
volume: "108"
issue: "5"
pages: "052213"
doi: 10.1103/PhysRevA.108.052213
arxiv: "2106.07899"
research:
  - thermo
abstract: >-
  We present a scheme for the charging of a quantum battery based on the dynamics of an
  open quantum system undergoing coherent quantum squeezing and affected by an incoherent
  squeezed thermal bath. We show that quantum coherence, as instigated by the application
  of coherent squeezing, are key in the determination of the performance of the charging
  process, which is efficiency-enhanced at low environmental temperature and under a
  strong squeezed driving.

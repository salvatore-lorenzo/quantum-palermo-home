title: Noise-Enhanced Stability of Sine-Gordon Breathers
authors:
  - D. De Santis
  - C. Guarcello
  - B. Spagnolo
  - Angelo Carollo
  - D. Valenti
date: 2023-08-01
type: article
journal: Il Nuovo Cimento C
volume: "46"
issue: "4"
pages: 1--4
doi: 10.1393/ncc/i2023-23108-8
arxiv: "2306.13338"
abstract: >-
  A noise-induced enhancement of the breather stability in a lossy, stochastic sine-Gordon
  system is discussed. The numerical solutions indicate that a spatially uniform noisy
  source enables a stationary breather to survive way beyond its deterministic lifetime.
  An average characteristic time for the breather is defined, whose values vary
  nonmonotonically as a function of the noise strength, while being almost unaffected by
  the mode's initial phase.

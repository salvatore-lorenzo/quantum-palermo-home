abstract: >-
  We present an analytical study of the dynamics of a qubit coupled to the zigzag edge of
  a photonic honeycomb lattice. Leveraging a resolvent operator approach and exact lattice
  Green's functions, we map the spectrum of qubit-photon bound states and complex poles to
  uncover the long-time scaling laws of the qubit population. Unlike a qubit coupled to
  the bulk of graphene, the presence of a zero-energy flat band connecting the Dirac
  points suppresses long-time branch-cut-induced tails, instead driving damped Rabi
  oscillations. Potential experimental platforms are briefly discussed.

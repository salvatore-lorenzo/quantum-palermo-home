title: Statistics of Residence Time for Lévy Flights in Unstable Parabolic Potentials
authors:
  - Alexander A. Dubkov
  - Bartłomiej Dybiec
  - Bernardo Spagnolo
  - Anna Kharcheva
  - Claudio Guarcello
  - Davide Valenti
date: 2020-01-01
type: article
journal: Physical Review E
volume: "102"
issue: "4"
doi: 10.1103/PhysRevE.102.042142
keywords:
  - Analytical results
  - Average residence time
abstract: >-
  We analyze the residence time problem for an arbitrary Markovian process describing
  nonlinear systems without a steady state. We obtain exact analytical results for the
  statistical characteristics of the residence time. For diffusion in a fully unstable
  potential profile in the presence of Lévy noise we get the conditional probability
  density of the particle position and the average residence time. The noise-enhanced
  stability phenomenon is observed in the system investigated. Results from numerical
  simulations are in very good agreement with analytical ones. o̧pyright 2020 American
  Physical Society.

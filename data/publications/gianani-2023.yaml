title: >-
  Diagnostics of Quantum-Gate Coherences Deteriorated by Unitary Errors via
  End-Point-Measurement Statistics
authors:
  - Ilaria Gianani
  - Alessio Belenchia
  - Stefano Gherardini
  - Vincenzo Berardi
  - Marco Barbieri
  - Mauro Paternostro
date: 2023-10-01
type: article
journal: Quantum Science and Technology
volume: "8"
issue: "4"
pages: "045018"
doi: 10.1088/2058-9565/acedca
arxiv: "2209.02049"
abstract: >-
  Abstract Quantum coherence is a central ingredient in quantum physics with several
  theoretical and technological ramifications. We consider a figure of merit encoding the
  information on how the coherence generated on average by a quantum gate is affected by
  unitary errors (coherent noise sources) in the form of rotation-angle and rotation-axis
  errors. We provide numerical evidences that such information is well captured by the
  statistics of local energy measurements on the output states of the gate. These findings
  are then corroborated by experimental data taken in a quantum optics setting.

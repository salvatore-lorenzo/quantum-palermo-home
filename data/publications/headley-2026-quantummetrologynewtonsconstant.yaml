title: Quantum Metrology of Newton's Constant with Levitated Mechanical Systems
authors:
  - Francis J. Headley
  - Alessio Belenchia
  - Mauro Paternostro
  - Daniel Braun
date: 2026-03-01
type: preprint
arxiv: "2503.16215"

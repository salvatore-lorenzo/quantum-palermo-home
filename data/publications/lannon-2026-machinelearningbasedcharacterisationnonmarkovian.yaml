title: >-
  Machine Learning-Based Characterisation of the Non-Markovian Dynamics of a
  Nitrogen-Vacancy Centre
authors:
  - Tom Lannon
  - Mauro Paternostro
  - John Martin Gregg
  - Amit Kumar
date: 2026-08-01
type: preprint
arxiv: "2608.27632"
url: https://arxiv.org/abs/2608.27632
research:
  - qml
  - metro
abstract: >-
  The interaction between a quantum system and its environment can be characterized by the
  spectral density function: knowing its structure is important for optimizing
  applications of quantum technologies such as quantum sensing protocols. In this work, we
  present the first experimental demonstration of a machine learning-based reconstruction
  of reaction-coordinate spectral density parameters from NV centre Rabi dynamics. Unlike
  the previous work, we recover all spectral density parameters rather than only the
  central frequency, and benchmark the performance of the neural network against the
  Cramér-Rao bound and maximum likelihood estimator. Our results demonstrate that the
  model predicted by the neural network can reliably reproduce the NV dynamics over the
  estimation window, and can produce estimates for some parameters with variances
  comparable to that of maximum likelihood.

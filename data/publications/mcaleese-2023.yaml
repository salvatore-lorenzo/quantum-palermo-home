title: Engineering Nonlinear Boson-Boson Interactions Using Mediating Spin Systems
authors:
  - Hannah McAleese
  - Mauro Paternostro
  - Ricardo Puebla
date: 2025-06-12
type: article
journal: Physical Review Research
doi: https://doi.org/10.1103/PhysRevResearch.7.023253
arxiv: "2309.10060"
keywords:
  - Quantum Physics
abstract: >-
  We present a protocol to create entangled coherent states by engineering cross-Kerr
  interactions between bosonic systems endowed with (externally driven) internal spin-like
  degrees of freedom. With slight modifications, the protocol is also able to produce N00N
  states through nonlinear beam splitter interactions. Each bosonic system interacts
  locally with its spin and by suitably tuning the model parameters, various classes of
  effective bosonic interaction Hamiltonians, mediated by the coupled spins, can be
  engineered. Our approach is benchmarked by numerical simulations aimed at studying the
  entanglement within a bosonic register and comparing it with the expected one resulting
  from the target Hamiltonians.

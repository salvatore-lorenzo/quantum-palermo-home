title: Strategies for entanglement distribution in optical fiber networks
authors:
  - Hannah McAleese
  - Anuj Agrawal
  - Vivek Vasan
  - Conall J. Campbell
  - Adam G Hawkins
  - Daniel C Kilper
  - Mauro Paternostro
  - Marco Ruffini
date: 2025-10-01
type: article
journal: Physical Review Research
doi: https://doi.org/10.1103/84qz-1jz2
arxiv: "2411.07306"
research:
  - qinfo
keywords:
  - quantum communication

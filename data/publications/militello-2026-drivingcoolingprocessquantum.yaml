title: Driving the cooling process of a quantum system via classical noise
authors:
  - B. Militello
  - A. Napoli
date: 2026-10-01
type: preprint
arxiv: "2610.21608"
url: https://arxiv.org/abs/2610.21608
abstract: >-
  It is known that under particular hypotheses anomalous thermalization processes can
  occur, such as the Mpemba effect, consisting in a faster cooling down when the system is
  prepared in a hotter initial condition, thus making convenient to warm up the system
  before the freezing process in order to make it freeze in a shorter time. It is shown
  here that the action of a Markovian classical noise during the freezing process can
  accelerate the approach to the zero-temperature thermal state. This prediction is
  counterintuitive, especially after observing that a classical noise can be considered
  equivalent to the action of an infinite-temperature reservoir, since both drive the
  system toward the same state. These facts lead to the statement that warming up the
  system during the contact with a low-temperature reservoir can accelerate the cooling
  process.

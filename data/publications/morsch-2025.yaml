title: Quantum simulations of complex systems
authors:
  - Oliver Morsch
  - G. Massimo Palma
  - Davide Rossini
date: 2025-05-01
type: article
journal: La Rivista del Nuovo Cimento
doi: 10.1007/s40766-025-00069-0

research:
  - thermo
abstract: >-
  In this review we give a brief overview of quantum simulation as applied to the study of
  complex systems. In particular, we cover the basic ideas of quantum simulation,
  neuromorphic computation, the Sachdev-Ye-Kitaev model, as well as applications to
  quantum batteries.

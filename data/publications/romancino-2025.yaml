title: Multipartite entanglement in the diagonal symmetric subspace
authors:
  - Jordi Romero-Pallejà
  - Jennifer Ahiable
  - Alessandro Romancino
  - Carlo Marconi
  - Anna Sanpera
date: 2025-02-01
type: article
journal: Journal of Mathematical Physics
volume: "66"

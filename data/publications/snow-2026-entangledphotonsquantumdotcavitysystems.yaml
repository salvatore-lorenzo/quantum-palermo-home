title: >-
  Entangled photons from quantum-dot-cavity systems under non-Markovian decoherence by
  pulsed excitation
authors:
  - Katy Snow
  - Mauro Paternostro
date: 2026-09-01
type: article
journal: Phys. Rev. B
volume: "114"

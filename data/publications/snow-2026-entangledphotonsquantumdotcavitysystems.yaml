research:
  - qinfo
abstract: >-
  Cascaded emission from the biexciton state of a quantum dot results in polarization
  entangled photon pairs. Cavity-enhancement of the direct two-photon emission channel
  bypasses the dominant source of decoherence in this system - that due to fine-structure
  splitting of the exciton levels. Here, we investigate the remaining non-Markovian
  phonon-induced decoherence using the numerically exact uniTEMPO algorithm. We compute
  the degree of entanglement of photon pairs generated by pulsed two-photon resonant
  excitation and find surprisingly good agreement between the numerically exact results
  and those calculated using the approximate polaron master equation method, permitting an
  efficient exploration of trends across system parameters.

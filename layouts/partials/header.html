<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}: home">{{ partial "logo.html" . }}</a>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <ul>
        {{- range site.Menus.main }}
        {{- $active := false }}
        {{- with .Page }}{{ $active = or (eq . $) (and (ne $.Section "") (eq .Section $.Section)) }}{{ end }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <button class="icon-btn theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Light / dark theme">
      <span class="when-light">{{ partial "icon.html" "moon" }}</span><span class="when-dark">{{ partial "icon.html" "sun" }}</span>
    </button>
    <button class="icon-btn menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="Menu">
      <span class="when-closed">{{ partial "icon.html" "menu" }}</span><span class="when-open">{{ partial "icon.html" "close" }}</span>
    </button>
  </div>
</header>
